<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostGrant demo report</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="description" content="A GhostGrant report for a fictional retired AI agent. Every credential in it is made up.">
  <style>
    :root { color-scheme: dark; --bg: #060606; --fg: #e4e4e7; --muted: #a1a1aa; --line: #27272a; --accent: #f59e0b; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 Inter, system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px 24px; }
    footer { max-width: 860px; margin: 0 auto; padding: 0 20px 64px; }
    footer a { color: var(--accent); }
    code, time, td { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    .meta { color: var(--muted); overflow-wrap: anywhere; }
    .note { color: var(--muted); border-left: 3px solid var(--accent); padding-left: 12px; }
    .verdict { padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; }
    .verdict.flipped, .verdict.alive, .verdict.unknown { border-color: #b91c1c; }
    .verdict.clean { border-color: #15803d; }
    .cred { margin-top: 28px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    tr.alive td { color: #fca5a5; }
    tr.unknown td { color: #fcd34d; }
    tr.dead td:last-child { color: #86efac; }
    .flag { color: #f87171; }
    .src-bar { display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 16px; background: #0c0c0e; border-bottom: 1px solid var(--line); font-size: 12px; }
    .src-note { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
    .src-note strong { font-weight: 600; color: var(--accent); }
    .src-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; color: #d4d4d8; text-decoration: none; }
    .src-link:hover { color: #fafafa; }
  </style>
</head>
<body>
  <div class="src-bar">
    <p class="src-note"><strong>Demo</strong> &middot; a fictional retired agent with made-up credentials. No provider is called.</p>
    <a class="src-link" href="https://github.com/ai-automation-tools/ghost-grant" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      View source
    </a>
  </div>
  <main>
    <p>Loading the demo report.</p>
  </main>
  <footer>
    <p class="note"><a href="./demo-inventory.json" download>Download this demo as an inventory</a>: the same checks in the Agent Security Suite's shared format (schema v0.1), as <code>ghostgrant export --format inventory --mock</code> writes it.</p>
  </footer>
  <noscript><p>This demo renders its report with JavaScript.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
